# ReadSW Console — pipeline Buddy (dibuat otomatis dari repo).
# Pipeline ini cuma install + cek + test. Tidak ada aksi deploy:
# deploy tetap butuh target (server/VPS/Sandbox) yang dipilih terpisah.
- pipeline: "ReadSW Console CI"
  trigger_mode: "ON_EVERY_PUSH"
  ref_name: "main"
  actions:
  - action: "Install + test"
    type: "BUILD"
    docker_image_name: "library/node"
    docker_image_tag: "20"
    execute_commands:
    - "npm install --no-audit --no-fund"
    - "npm run check"
    - "node --test test/*.test.js"
